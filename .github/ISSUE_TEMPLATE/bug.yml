name: Bug report
description: Report a reproducible defect or regression.
title: "bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** report security vulnerabilities here. Follow `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include commands, inputs, browser, and environment. Use synthetic data only.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include safe error output or logs with secrets removed.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and affected components
      description: Users affected, data risk, workaround, and relevant files.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Regression test requirements
      description: What test will fail before the fix and pass after it?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:critical
        - priority:high
        - priority:medium
        - priority:low
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      options:
        - label: area:backend
        - label: area:frontend
        - label: area:database
        - label: area:ci-cd
        - label: area:docs
  - type: checkboxes
    id: done
    attributes:
      label: Definition of Done
      options:
        - label: Root cause is identified and fixed.
          required: true
        - label: A regression test is added.
          required: true
        - label: Relevant quality gates pass.
          required: true
        - label: Pull request is merged and the issue is closed.
          required: true
