name: Feature request
description: Propose a new capability or meaningful enhancement.
title: "feat: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Read `AGENTS.md` first. Issues are the authoritative record of planned work.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background and technical context
      description: Current behavior, relevant code, constraints, and prior decisions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope of work
      description: What is included, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, verifiable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Related issues, ADRs, external services, or blockers.
  - type: textarea
    id: testing
    attributes:
      label: Testing requirements
      description: Unit, integration, security, API, browser, migration, or manual checks required.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and data-handling considerations
      description: Authentication, authorization, untrusted input, secrets, exports, and audit impact.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:critical
        - priority:high
        - priority:medium
        - priority:low
    validations:
      required: true
  - type: checkboxes
    id: areas
    attributes:
      label: Affected areas
      options:
        - label: area:backend
        - label: area:frontend
        - label: area:database
        - label: area:ci-cd
        - label: area:docs
  - type: checkboxes
    id: done
    attributes:
      label: Definition of Done
      options:
        - label: Acceptance criteria are satisfied.
          required: true
        - label: Tests and relevant quality gates pass.
          required: true
        - label: Security implications are reviewed.
          required: true
        - label: Documentation and changelog are updated.
          required: true
        - label: Pull request is merged and the issue is closed.
          required: true
