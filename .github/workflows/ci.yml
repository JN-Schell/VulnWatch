name: Validate VulnWatch
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnwatch
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: vulnwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vulnwatch -d vulnwatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://vulnwatch:ci-only-disposable-password@localhost:5432/vulnwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check app tests migrations && uv run ruff format --check app tests migrations
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q --cov=app --cov-report=term-missing
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://vulnwatch:ci-only-disposable-password@localhost:5432/vulnwatch_test
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnwatch
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: vulnwatch_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vulnwatch -d vulnwatch_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://vulnwatch:ci-only-disposable-password@localhost:5432/vulnwatch_e2e
      TRUSTED_ORIGINS: '["http://127.0.0.1:5173"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
      E2E_PASSWORD: ci-browser-test-only-password
      VULNWATCH_ADMIN_PASSWORD: ci-browser-test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --frozen --python 3.12 && uv run alembic upgrade head && uv run python -m app.cli create-admin
      - run: cd frontend && npm ci && npm run build && npx prettier --check src tests *.ts && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results/
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet && docker compose up --build --wait web
      - run: curl --fail http://localhost:8080/api/health && curl --fail http://localhost:8080/
      - run: docker compose logs && docker compose down -v
        if: always()
